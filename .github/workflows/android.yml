name: Android build and checks
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify wrapper, test, lint and build
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease --stacktrace
      - name: Assemble test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-reports
          path: |
            app/build/reports
            app/build/test-results
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-and-debug-apks
          path: app/build/outputs/apk/**/*.apk
  device-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api: [26, 33, 35, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          chmod +x gradlew
      - name: Test local shopping-list flow
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: default
          profile: pixel_2
          disable-animations: true
          script: bash tools/emulator-test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-api-${{ matrix.api }}
          path: |
            app/build/reports/androidTests
            app/build/outputs/androidTest-results
            test-screenshots
            test-service-log.txt
